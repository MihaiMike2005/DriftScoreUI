[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "driftscore"
version = "0.1.0"
description = "Drift-rating engine for Assetto Corsa: live telemetry in, drift signals out."
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest"]
